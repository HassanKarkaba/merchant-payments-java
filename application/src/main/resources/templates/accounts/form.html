<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title})}"></head><body><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1 th:text="${title}"></h1><p th:if="${message}" th:text="${message}"></p><p id="form-error" role="alert" class="error" th:if="${error}" th:text="${error}"></p><p class="muted" th:if="${correlation_id}">Reference <code th:text="${correlation_id}"></code></p><section th:if="${seed}"><h2>Authenticator secret</h2><p><code th:text="${seed}"></code></p><p th:text="${otp_uri}"></p></section><form method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input th:each="field:${hidden}" type="hidden" th:name="${field.key}" th:value="${field.value}"><div class="field" th:each="field:${inputs}"><label th:for="${field.key}" th:text="${#strings.replace(field.key,'_',' ')}"></label><input th:id="${field.key}" th:attr="aria-invalid=${error != null},aria-describedby=${error != null ? 'form-error' : null}" th:name="${field.key}" th:type="${field.value}" th:value="${field.value == 'password' ? '' : (values != null ? values[field.key] : (field.key == 'timezone' ? 'UTC' : ''))}" required th:maxlength="${field.key == 'password' ? 256 : (field.key == 'email' ? 254 : 100)}" th:autocomplete="${field.key == 'code' ? 'one-time-code' : (field.value == 'password' ? 'current-password' : 'off')}"></div><button type="submit" th:text="${button}"></button></form><p><a href="/accounts/profile/">Back to profile</a></p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
