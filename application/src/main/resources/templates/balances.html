<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p class="eyebrow">Authoritative ledger · Simulated USD</p><h1>Balances</h1><div class="stats"><div class="stat" th:each="b:${balances}"><span th:text="${#strings.replace(b.key,'_',' ')}"></span><strong th:text="${b.value}"></strong><span>USD cents</span></div></div><p>A capture is a clearing receivable. Payouts require settled bank cash and merchant payable after active reservations. Refunds can leave a visible deficit.</p><div class="actions"><a th:href="@{'/m/'+${merchant}+'/ledger/'}">Inspect journal</a><a class="secondary" th:href="@{'/m/'+${merchant}+'/payouts/'}">Payouts</a></div></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
