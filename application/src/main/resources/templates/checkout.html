<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p class="eyebrow">Guest checkout · Simulator only</p><h1 th:text="${link.name}"></h1><p>Amount in USD cents: <strong th:text="${link.amount_minor}"></strong></p><p>Expires UTC <span th:text="${link.expires_at}"></span>. No real payment instrument is accepted.</p><form method="post" th:action="@{'/checkout/'+${token}+'/confirm/'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="attempt_key" th:value="${attempt}"><div class="field"><label for="customer">Fictional customer name</label><input id="customer" name="customer_name" required maxlength="200" aria-describedby="customer-bound" autocomplete="off"><small id="customer-bound">At most 100 characters after normalization.</small></div><div class="field"><label for="token">Simulator behavior</label><select id="token" name="payment_token"><option value="tok_demo_success">Successful authorization</option><option value="tok_demo_decline">Declined</option><option value="tok_demo_timeout_after_commit">Commit with response loss</option><option value="tok_demo_requires_review">Rejected</option></select></div><button>Confirm simulated payment</button></form><p>After acceptance, processing continues even if this browser closes.</p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
