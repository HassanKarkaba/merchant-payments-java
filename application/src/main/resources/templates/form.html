<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1 th:text="${title}"></h1><p th:if="${message}" th:text="${message}" role="status"></p><form method="post" th:action="${action}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field" th:each="f:${fields}"><label th:for="${f.key}" th:text="${#strings.replace(f.key,'_',' ')}"></label><textarea th:if="${f.key == 'reason'}" th:id="${f.key}" th:name="${f.key}" th:text="${f.value}" maxlength="2000" required></textarea><input th:unless="${f.key == 'reason'}" th:id="${f.key}" th:name="${f.key}" th:value="${f.value}" maxlength="2000" required></div><button type="submit">Continue</button></form><p><a href="/">Home</a></p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
