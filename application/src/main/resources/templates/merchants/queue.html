<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head('Merchant review')}"></head><body><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>Merchant review</h1><p>Operations authority and a fresh sensitive-action step-up are required for lifecycle decisions.</p><p th:if="${#lists.isEmpty(merchants)}">No merchants on this page.</p><section th:each="merchant:${merchants}"><h2 th:text="${merchant.name}"></h2><p th:text="${merchant.id}+' · '+${merchant.status}+' · version '+${merchant.version}"></p><form th:each="action:${ {'activate','suspend','resume','close'} }" method="post" th:action="@{'/operations/merchants/'+${merchant.id}+'/'+${action}+'/'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="expected_version" th:value="${merchant.version}"><button th:text="${action}" type="submit"></button></form></section><nav aria-label="Pages"><a th:if="${page>0}" th:href="@{/operations/merchants/(page=${page-1})}">Previous page</a><a th:if="${#lists.size(merchants)==50}" th:href="@{/operations/merchants/(page=${page+1})}">Next page</a></nav></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
