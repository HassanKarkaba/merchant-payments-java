<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head('Merchant team')}"></head><body><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1 th:text="${merchant.name}+' team'"></h1><p>Changes require the current version. Revocation is permanent; the last active owner of an open merchant is protected.</p><section th:each="member:${members}"><h2 th:text="${member.email}"></h2><form method="post" th:action="@{'/m/'+${merchant.id}+'/team/'+${member.id}+'/change/'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="expected_version" th:value="${member.version}"><label th:for="${'role-'+member.id}">Role</label><select name="role" th:id="${'role-'+member.id}"><option th:each="role:${ {'OWNER','FINANCE','ANALYST'} }" th:value="${role}" th:text="${role}" th:selected="${role==member.role}"></option></select><label th:for="${'active-'+member.id}">Membership</label><select name="active" th:id="${'active-'+member.id}"><option value="true" th:selected="${member.active}">Active</option><option value="false" th:selected="${!member.active}">Permanently revoked</option></select><button type="submit" th:disabled="${!member.active}">Save member</button></form></section><h2>Invite a member</h2><form method="post" th:action="@{'/m/'+${merchant.id}+'/team/invite/'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="email">Fictional email</label><input id="email" type="email" name="email" maxlength="254" required><label for="role">Role</label><select id="role" name="role"><option>OWNER</option><option>FINANCE</option><option>ANALYST</option></select><button type="submit">Send invitation to Mailpit</button></form><h2>Invitation history</h2><p th:if="${#lists.isEmpty(invitations)}">No invitations yet.</p><ul><li th:each="invite:${invitations}"><span th:text="${invite.email}+' · '+${invite.role}+' · expires '+${invite.expires_at}"></span><form th:if="${invite.revoked_at==null and invite.consumed_at==null}" method="post" th:action="@{'/m/'+${merchant.id}+'/team/invitations/'+${invite.id}+'/revoke/'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Revoke invitation</button></form></li></ul><p><a th:href="@{'/m/'+${merchant.id}+'/'}">Merchant overview</a></p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
