<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>Notifications</h1><p th:if="${notifications.isEmpty()}">You have no notifications.</p><article th:each="n:${notifications}"><h2 th:text="${n.title}"></h2><p th:text="${n.body}"></p><small th:text="${n.created_at}"></small><form method="post" th:if="${n.read_at == null}" th:action="@{'/notifications/'+${n.id}+'/read/'}"><button>Mark read</button></form></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
