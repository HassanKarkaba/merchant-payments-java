<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p class="eyebrow">Accepted work</p><h1 th:text="${operation.execution_state}"></h1><p role="status" th:text="${operation.safe_message}"></p><dl><dt>Operation</dt><dd th:text="${operation.operation_id}"></dd><dt>Business state</dt><dd th:text="${operation.business_state}"></dd><dt>Outcome known</dt><dd th:text="${operation.outcome_known}"></dd><dt>Updated</dt><dd th:text="${operation.updated_at}"></dd></dl><p>Refresh to inspect. Accepted work continues independently of your browser. An uncertain result retains its original provider key and reservation.</p><form method="post" th:if="${operation.execution_state == 'QUEUED'}" th:action="@{'/m/'+${merchant}+'/operations/'+${operation.operation_id}+'/cancel/'}"><input type="hidden" name="action_key" th:value="${action_key}"><input type="hidden" name="expected_version" th:value="${operation.version}"><input type="hidden" name="proposal_hash" th:value="${proposal_hash}"><button>Cancel unsent work</button></form><a th:href="@{'/m/'+${merchant}+'/payments/'}">Back to payments</a></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
