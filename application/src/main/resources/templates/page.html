<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1 th:text="${title}"></h1><p th:if="${rows.isEmpty()}" role="status">There are no records to show.</p><div class="table-wrap" th:unless="${rows.isEmpty()}"><table><thead><tr><th th:each="key:${rows[0].keySet()}" th:text="${key}"></th></tr></thead><tbody><tr th:each="row:${rows}"><td th:each="cell:${row}" th:text="${cell.value}"></td></tr></tbody></table></div><p><a href="/">Home</a></p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
