<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p class="eyebrow">Payment detail · Simulated USD</p><h1 th:text="${payment.status}"></h1><dl><dt>Payment</dt><dd th:text="${payment.id}"></dd><dt>Captured cents</dt><dd th:text="${payment.captured_minor}"></dd><dt>Refunded cents</dt><dd th:text="${payment.refunded_minor}"></dd><dt>Reserved refund cents</dt><dd th:text="${payment.reserved_refund_minor}"></dd><dt>Authorization expires UTC</dt><dd th:text="${payment.authorization_expires_at}"></dd></dl><div class="actions"><a th:if="${payment.status == 'AUTHORIZED'}" th:href="@{'/m/'+${merchant}+'/payments/'+${payment.id}+'/capture/'}">Final capture</a><a th:if="${payment.status == 'AUTHORIZED'}" class="secondary" th:href="@{'/m/'+${merchant}+'/payments/'+${payment.id}+'/void/'}">Void</a><a th:if="${payment.status == 'CAPTURED'}" th:href="@{'/m/'+${merchant}+'/payments/'+${payment.id}+'/refunds/new/'}">Refund</a></div><h2>Durable operations</h2><div class="table-wrap"><table><thead><tr><th>Action</th><th>Execution state</th><th>Inspect</th></tr></thead><tbody><tr th:each="o:${operations}"><td th:text="${o.kind}"></td><td th:text="${o.status}"></td><td><a th:href="@{'/m/'+${merchant}+'/operations/'+${o.id}+'/'}">Inspect result</a></td></tr></tbody></table></div></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
