<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p class="eyebrow">Simulated USD</p><h1>Payments and links</h1><div class="actions"><a th:href="@{'/m/'+${merchant}+'/links/new/'}">Create payment link</a><a class="secondary" th:href="@{'/m/'+${merchant}+'/'}">Merchant overview</a></div><h2>Payments</h2><p th:if="${payments.isEmpty()}">Create a link and open its guest checkout to make your first simulated payment.</p><div class="table-wrap"><table><thead><tr><th>Payment</th><th>Business state</th><th>Captured cents</th><th>Refunded cents</th></tr></thead><tbody><tr th:each="p:${payments}"><td><a th:href="@{'/m/'+${merchant}+'/payments/'+${p.id}+'/'}" th:text="${p.id}"></a></td><td th:text="${p.status}"></td><td th:text="${p.captured_minor}"></td><td th:text="${p.refunded_minor}"></td></tr></tbody></table></div><h2>Recent links</h2><div class="table-wrap"><table><thead><tr><th>Amount cents</th><th>Mode</th><th>Expires UTC</th><th>Availability</th></tr></thead><tbody><tr th:each="l:${links}"><td th:text="${l.amount_minor}"></td><td th:text="${l.capture_mode}"></td><td th:text="${l.expires_at}"></td><td><span th:text="${l.consumed_at != null ? 'Consumed' : (l.revoked_at != null ? 'Revoked' : 'Unconsumed')}"></span><form class="inline" method="post" th:action="@{'/m/'+${merchant}+'/links/'+${l.id}+'/revoke/'}" th:if="${l.consumed_at == null and l.revoked_at == null}"><button>Revoke</button></form></td></tr></tbody></table></div></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
