<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>Retention and namespace retirement</h1><p>Only merchants closed for at least365 days are eligible. Propose and independently approve a frozen inventory here, then run the separate operator procedure. Web and ordinary workers have no purge credentials.</p><form method="post" th:action="@{/operations/purges/new/}"><label for="merchant">Closed merchant UUID</label><input id="merchant" name="merchant_id" required><label for="backups">Explicit backup-store inventory</label><textarea id="backups" name="backup_inventory" maxlength="2000" required></textarea><button>Propose purge</button></form><article th:each="p:${purges}"><h2 th:text="${p.id}"></h2><p th:text="${p.phase}"></p><form method="post" th:action="@{'/operations/purges/'+${p.id}+'/approve/'}"><button>Approve as independent finance approver</button></form></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
