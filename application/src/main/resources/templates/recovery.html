<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>Recovery inventories</h1><p>Financial admission stays held until provider commitments, retained admissions, journals, reservations and feed positions agree. A different finance approver must release an unchanged inventory.</p><form method="post" th:action="@{/operations/recovery/propose/}"><button>Create inventory as operations maker</button></form><article th:each="i:${inventories}"><h2 th:text="${i.id}"></h2><p th:text="${i.status}"></p><form method="post" th:action="@{'/operations/recovery/'+${i.id}+'/release/'}"><button>Release as independent finance approver</button></form></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
