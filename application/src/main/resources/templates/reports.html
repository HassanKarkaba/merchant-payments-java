<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>Reports and exports</h1><p>Exports preserve a consistent cutoff and expire after 24 hours. Your current authority is rechecked when the file is built and downloaded.</p><form method="post" th:action="@{'/m/'+${merchant}+'/exports/'}"><label for="kind">Report</label><select id="kind" name="kind"><option value="payments">Payments</option><option value="ledger">Journal</option></select><button>Request export</button></form><div class="table-wrap"><table><thead><tr><th>Kind</th><th>State</th><th>Retrieve</th></tr></thead><tbody><tr th:each="e:${exports}"><td th:text="${e.kind}"></td><td th:text="${e.status}"></td><td><a th:href="@{'/exports/'+${e.id}+'/'}">Inspect</a></td></tr></tbody></table></div></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
