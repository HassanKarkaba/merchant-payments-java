<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{accounts/chrome :: head(${title ?: 'Merchant payments'})}"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><h1>System status</h1><dl><th:block th:each="c:${capabilities}"><dt th:text="${c.key}"></dt><dd th:text="${c.value ? 'Ready' : 'Held / unavailable'}"></dd></th:block><dt>Audit chain</dt><dd th:text="${audit_valid ? 'Valid' : 'Integrity failure'}"></dd></dl><h2>Uncertain operations</h2><p th:if="${unknown.isEmpty()}">No uncertain operations.</p><div th:each="o:${unknown}"><a th:href="@{'/m/'+${o.merchant_id}+'/operations/'+${o.id}+'/'}" th:text="${o.id}"></a><span th:text="${o.reason}"></span><form method="post" th:action="@{'/operations/jobs/'+${o.job_id}+'/redrive/'}"><label th:for="${o.job_id}">Recovery reason</label><input th:id="${o.job_id}" name="reason" required maxlength="2000"><button>Resume original operation</button></form></div><h2>Quarantine</h2><article th:each="q:${quarantine}"><p th:text="${q.safe_reason}"></p><form method="post" th:action="@{'/operations/quarantine/'+${q.id}+'/redrive/'}"><label th:for="${q.id}">Redrive reason</label><input th:id="${q.id}" name="reason" required maxlength="2000"><button>Redrive retained event</button></form></article><p><a href="/operations/recovery/">Recovery inventory and hold</a></p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
