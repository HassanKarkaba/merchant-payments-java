<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispute</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Simulated USD cents · Deadlines in UTC</p><h1>Dispute</h1><a th:href="@{'/m/'+${merchant}+'/disputes/'}">Back to disputes</a><dl><th:block th:each="v:${dispute}"><dt th:text="${v.key}"></dt><dd th:text="${v.value}"></dd></th:block></dl><form th:if="${dispute.status=='OPEN'}" method="post" th:action="@{'/m/'+${merchant}+'/disputes/'+${dispute.id}+'/respond/'}"><label for="response">Plain text response, at most 2000 characters</label><textarea id="response" name="response" maxlength="2000" required></textarea><input type="hidden" name="action_key" th:value="${actionKey}"><button>Submit before the UTC deadline</button></form><p>Accepted responses complete asynchronously and do not promise a win.</p></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
