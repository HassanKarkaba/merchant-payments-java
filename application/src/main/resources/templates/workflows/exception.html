<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconciliation exception</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Monetary differences cannot be waived</p><h1>Reconciliation exception</h1><a th:href="@{'/operations/reconciliation/?merchant_id='+${exception.merchant_id}}">Back to workspace</a><dl><th:block th:each="v:${exception}"><dt th:text="${v.key}"></dt><dd th:text="${v.value}"></dd></th:block></dl><form method="post" th:action="@{'/operations/exceptions/'+${exception.id}+'/investigate/'}"><input type="hidden" name="version" th:value="${exception.version}"><label for="reason">Investigation note</label><textarea id="reason" name="reason" maxlength="2000" required></textarea><button>Assign and investigate</button><button th:formaction="@{'/operations/exceptions/'+${exception.id}+'/wait/'}">Wait for provider evidence</button><button th:formaction="@{'/operations/exceptions/'+${exception.id}+'/resolve/'}">Resolve after complete evidence</button><button th:if="${exception.amount_minor==0}" th:formaction="@{'/operations/exceptions/'+${exception.id}+'/accept/'}">Accept proven nonfinancial case</button><button th:if="${exception.category=='UNRECOGNIZED_CORRECTION'}" th:formaction="@{'/operations/exceptions/'+${exception.id}+'/recognize/'}">Propose independent correction recognition</button></form><h2>Retained history</h2><article th:each="h:${history}"><p th:text="${h.created_at+' · '+h.state+' · '+h.reason}"></p><pre th:if="${h.legacy_json!=null}" th:text="${h.legacy_json}"></pre></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
