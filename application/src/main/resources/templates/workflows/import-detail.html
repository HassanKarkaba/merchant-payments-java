<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statement preview</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Simulated USD cents</p><h1>Statement preview</h1><a th:href="@{'/operations/reconciliation/?merchant_id='+${statement.merchant_id}}">Back to workspace</a><dl><th:block th:each="v:${statement}"><dt th:text="${v.key}"></dt><dd th:text="${v.value}"></dd></th:block></dl><p th:if="${statement.status=='EXPIRED'}" role="status">Staging expired. Transient bytes have been removed. Upload a new file.</p><p th:if="${statement.status=='INVALID' or statement.status=='QUARANTINED'}" role="alert" th:text="${statement.errors_json}"></p><form th:if="${statement.status=='VALIDATED'}" method="post" th:action="@{'/operations/imports/'+${statement.id}+'/confirm/'}"><input type="hidden" name="version" th:value="${statement.version}"><button>Confirm every row against authenticated manifest</button></form><form th:if="${statement.status!='CONFIRMED' and statement.status!='CANCELLED'}" method="post" th:action="@{'/operations/imports/'+${statement.id}+'/cancel/'}"><input type="hidden" name="version" th:value="${statement.version}"><button>Cancel unconfirmed staging</button></form><h2>First 100 parsed rows</h2><p th:if="${preview.empty}">No retained preview rows.</p><div class="table-wrap"><table th:unless="${preview.empty}"><thead><tr><th th:each="h:${preview[0].keySet()}" th:text="${h}"></th></tr></thead><tbody><tr th:each="r:${preview}"><td th:each="v:${r.values()}" th:text="${v}"></td></tr></tbody></table></div></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
