<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Simulated USD cents</p><h1>Payout</h1><a th:href="@{'/m/'+${merchant}+'/payouts/'}">Back to payouts</a><dl><th:block th:each="v:${payout}"><dt th:text="${v.key}"></dt><dd th:text="${v.value}"></dd></th:block></dl><p>Approval requires a different current owner and five-minute password/TOTP step-up.</p><a href="/accounts/step-up/">Step up authentication</a><form th:if="${payout.status=='PROPOSED' or payout.status=='NEEDS_REAPPROVAL'}" method="post" th:action="@{'/m/'+${merchant}+'/payouts/'+${payout.id}+'/approve/'}"><input type="hidden" name="version" th:value="${payout.version}"><input type="hidden" name="action_key" th:value="${actionKey}"><input type="hidden" name="proposal_hash" th:value="${payout.payload_hash}"><button>Approve frozen payout</button></form><form th:if="${payout.status=='PROPOSED' or payout.status=='NEEDS_REAPPROVAL' or payout.status=='APPROVED'}" method="post" th:action="@{'/m/'+${merchant}+'/payouts/'+${payout.id}+'/cancel/'}"><input type="hidden" name="version" th:value="${payout.version}"><input type="hidden" name="action_key" th:value="${actionKey}"><button>Cancel if still unsent</button></form><a th:if="${payout.operation_id!=null}" th:href="@{'/m/'+${merchant}+'/operations/'+${payout.operation_id}+'/'}">Inspect durable operation</a><form th:if="${payout.status=='NEEDS_REAPPROVAL'}" method="post" th:action="@{'/m/'+${merchant}+'/payouts/'+${payout.id}+'/revise/'}"><input type="hidden" name="version" th:value="${payout.version}"><input type="hidden" name="action_key" th:value="${actionKey}"><label for="new-beneficiary">New active beneficiary proposal UUID</label><input id="new-beneficiary" name="beneficiary_id" required><button>Freeze a revised proposal with the same amount</button></form><h2>Retained proposal versions</h2><article th:each="v:${versions}"><h3 th:text="${'Version '+v.proposal_version}"></h3><pre th:text="${v.snapshot_json}"></pre></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
