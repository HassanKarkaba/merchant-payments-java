<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting periods</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · UTC calendar months</p><h1>Accounting periods</h1><nav><a href="/operations/periods/new/">Create open month</a> · <a href="/accounts/step-up/">Step up authentication</a> · <a href="/operations/reconciliation/">Reconciliation</a></nav><form method="get" th:action="@{/operations/periods/}"><label for="merchant">Merchant</label><select id="merchant" name="merchant_id"><option th:each="m:${merchants}" th:value="${m.id}" th:selected="${m.id==merchant}" th:text="${m.name}"></option></select><button>Inspect periods</button></form><h2>Months</h2><p th:if="${periods.empty}">No accounting periods.</p><article th:each="p:${periods}"><h3 th:text="${p.month+' · '+p.status}"></h3><form th:if="${p.status=='OPEN' or p.status=='CLOSED'}" method="post" th:action="@{'/operations/periods/'+${p.id}+'/'+(${p.status=='OPEN'}?'close':'reopen')+'/'}"><label th:if="${p.status=='CLOSED'}" th:for="${'reason-'+p.id}">Reason for reopening</label><textarea th:if="${p.status=='CLOSED'}" th:id="${'reason-'+p.id}" name="reason" maxlength="2000" required></textarea><button th:text="${p.status=='OPEN'?'Freeze close proposal':'Propose reopening'}"></button></form></article><h2>Independent decisions</h2><article th:each="p:${proposals}"><h3 th:text="${p.month+' · '+p.decision_kind+' · '+p.state}"></h3><p th:text="${p.reason}"></p><details><summary>Frozen snapshot</summary><pre th:text="${p.snapshot_json}"></pre></details><form th:if="${p.state=='PROPOSED'}" method="post" th:action="@{'/operations/periods/'+${p.id}+'/approve/'}"><input type="hidden" name="version" th:value="${p.version}"><input type="hidden" name="action_key" th:value="${actionKey}"><button>Approve as a different finance approver</button><button th:formaction="@{'/operations/periods/'+${p.id}+'/reject/'}">Reject proposal</button></form><form th:if="${p.state=='PROPOSED'}" method="post" th:action="@{'/operations/periods/'+${p.id}+'/cancel/'}"><input type="hidden" name="version" th:value="${p.version}"><input type="hidden" name="action_key" th:value="${actionKey}"><label th:for="${'cancel-'+p.id}">Reason to withdraw or replace a revoked maker</label><textarea th:id="${'cancel-'+p.id}" name="reason" maxlength="2000" required></textarea><button>Withdraw as maker or replace revoked maker</button></form></article><h2>Retained reports</h2><article th:each="r:${reports}"><a th:href="@{'/m/'+${r.merchant_id}+'/reports/close/'+${r.id}+'/'}" th:text="${r.month+' · version '+r.version+' · valid '+r.valid}"></a></article></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
