<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}"></title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Simulated USD cents · UTC deadlines</p><h1 th:text="${title}"></h1><a th:href="@{'/m/'+${merchant}+'/'}">Merchant overview</a><form method="get" th:action="${listUrl}"><label th:if="${statusFilter!=null}" for="status">Status filter (blank shows all)</label><input th:if="${statusFilter!=null}" id="status" name="status" maxlength="16" th:value="${statusFilter}"><label for="size">Rows per page, up to 100</label><input id="size" name="size" type="number" min="1" max="100" th:value="${size}"><button>Apply filters</button></form><p th:if="${rows.empty}" role="status">No records match this page and filter.</p><div class="table-wrap"><table th:unless="${rows.empty}"><thead><tr><th th:each="key:${rows[0].keySet()}" th:text="${key}"></th></tr></thead><tbody><tr th:each="row:${rows}"><td th:each="cell:${row}"><a th:if="${cell.key=='id'}" th:href="@{${detailBase}+${cell.value}+'/'}" th:text="${cell.value}"></a><span th:unless="${cell.key=='id'}" th:text="${cell.value}"></span></td></tr></tbody></table></div><nav><a th:if="${page>0}" th:href="@{${listUrl}(page=${page-1},size=${size},status=${statusFilter ?: ''})}">Previous page</a><span th:text="${'Page '+(page+1)}"></span><a th:href="@{${listUrl}(page=${page+1},size=${size},status=${statusFilter ?: ''})}">Next page</a></nav></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
