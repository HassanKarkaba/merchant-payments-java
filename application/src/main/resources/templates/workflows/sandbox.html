<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic provider controls</title><link rel="stylesheet" href="/style.css"></head><body><a href="#main" class="skip">Skip to content</a><header th:replace="~{accounts/chrome :: nav}"></header><main id="main"><p>Local sandbox · Fictional effects only</p><h1>Synthetic provider controls</h1><a href="/operations/status/">System status</a><h2>Flush settlement</h2><p>Use the same cutoff identity to inspect the same immutable batch. A different cutoff can flush a later batch.</p><form method="post" th:action="@{/operations/sandbox/settlements/flush/}"><label for="merchant">Merchant</label><select id="merchant" name="merchant_id"><option th:each="m:${merchants}" th:value="${m.id}" th:text="${m.name}"></option></select><label for="cutoff">Cutoff identity</label><input id="cutoff" name="cutoff_identity" required maxlength="128"><input type="hidden" name="action_key" th:value="${actionKey}"><button>Admit durable settlement flush</button></form><h2>Open a synthetic dispute</h2><article th:each="p:${payments}"><p th:text="${p.id+' · '+p.status+' · captured '+p.captured_minor+' cents'}"></p><form th:if="${p.captured_minor>0}" method="post" th:action="@{'/operations/sandbox/payments/'+${p.id}+'/open-dispute/'}"><label th:for="${'amount-'+p.id}">Disputed principal cents</label><input th:id="${'amount-'+p.id}" name="amount_minor" required pattern="[0-9]+"><input type="hidden" name="action_key" th:value="${actionKey}"><button>Open provider dispute</button></form></article><h2>Issue authenticated unrecognized correction</h2><form method="post" th:action="@{/operations/sandbox/corrections/new/}"><label for="correction-merchant">Merchant</label><select id="correction-merchant" name="merchant_id"><option th:each="m:${merchants}" th:value="${m.id}" th:text="${m.name}"></option></select><label for="event">Event type</label><select id="event" name="event_type"><option>CORRECTION_CREDIT</option><option>CORRECTION_DEBIT</option></select><label for="amount">Absolute cents</label><input id="amount" name="amount_minor" pattern="[0-9]+" required><label for="reason">Reason</label><textarea id="reason" name="reason" required maxlength="2000"></textarea><input type="hidden" name="action_key" th:value="${actionKey}"><button>Admit synthetic correction for later independent recognition</button></form></main><footer th:replace="~{accounts/chrome :: footer}"></footer></body></html>
